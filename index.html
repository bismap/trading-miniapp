<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Торговля</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="tab-capital" class="tab-page active">
      <header class="header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 6V4a1 1 0 011-1h10a1 1 0 011 1v2"/></svg>
        </div>
        <div>
          <div class="header-title">Капитал</div>
          <div class="header-sub" id="header-sub">Текущее состояние</div>
        </div>
      </header>

      <div class="card dashboard">
        <div class="dash-grid">
          <div class="dash-item main">
            <div class="dash-label">Текущий капитал</div>
            <div class="dash-value" id="current-capital">—</div>
            <div class="dash-sub" id="invested-line">Вложено: —</div>
          </div>
          <div class="dash-item">
            <div class="dash-label">Прибыль</div>
            <div class="dash-value green" id="profit">—</div>
          </div>
          <div class="dash-item">
            <div class="dash-label">Рост</div>
            <div class="dash-value green" id="growth-pct">—</div>
          </div>
        </div>
        <div class="progress-block">
          <div class="progress-header">
            <span class="progress-title">Цель</span>
            <span class="progress-goal" id="goal-text">—</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-meta" id="progress-meta">—</div>
        </div>
      </div>

      <div class="card chart-card">
        <div class="card-title-row">
          <div class="card-title" style="margin:0">Рост капитала</div>
          <div class="chart-stats" id="chart-stats"></div>
        </div>
        <canvas id="growth-chart" height="260"></canvas>
      </div>
    </section>

    <section id="tab-trading" class="tab-page">
      <header class="header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
        </div>
        <div>
          <div class="header-title">Торговля</div>
          <div class="header-sub" id="trading-year-label">Шаги плана и закрытия</div>
        </div>
      </header>

      <div class="card">
        <div class="money-actions">
          <button class="btn btn-secondary btn-half" id="btn-show-deposit">Пополнить</button>
          <button class="btn btn-secondary btn-half" id="btn-show-withdraw">Забрать</button>
        </div>
        <div id="money-form" class="money-form hidden">
          <div class="money-form-title" id="money-form-title">Сумма</div>
          <div class="action-row">
            <input type="number" id="money-input" placeholder="Сумма" step="0.01" min="0" inputmode="decimal" />
            <button class="btn btn-primary btn-sm" id="btn-money-confirm">OK</button>
          </div>
          <div class="hint" id="money-form-hint"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title" style="margin:0">План шагов</div>
          <div class="steps-filter">
            <button class="chip active" data-filter="all">Все</button>
            <button class="chip" data-filter="closed">Закрытые</button>
            <button class="chip" data-filter="plan">План</button>
          </div>
        </div>
        <div id="steps-list" class="steps-list"></div>
      </div>
    </section>

    <section id="tab-settings" class="tab-page">
      <header class="header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </div>
        <div>
          <div class="header-title">Настройки</div>
          <div class="header-sub">Параметры плана</div>
        </div>
      </header>

      <div class="card">
        <div class="card-title">Основные параметры</div>
        <div class="params">
          <label><span>Стартовый капитал</span>
            <input type="number" id="param-start" step="0.01" min="0" inputmode="decimal" /></label>
          <label><span>Целевой % на шаг</span>
            <div class="input-with-suffix">
              <input type="number" id="param-pct" step="0.1" min="0.1" max="100" inputmode="decimal" />
              <span class="suffix">%</span>
            </div></label>
          <label><span>Цель по капиталу</span>
            <input type="text" id="param-goal" inputmode="numeric" placeholder="1 000 000" /></label>
        </div>
        <button class="btn btn-primary" id="btn-save-params">Сохранить параметры</button>
      </div>
      <div class="version-block">Данные хранятся в Telegram</div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="capital">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 6V4a1 1 0 011-1h10a1 1 0 011 1v2"/></svg></span>
      <span class="nav-label">Капитал</span>
    </button>
    <button class="nav-btn" data-tab="trading">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg></span>
      <span class="nav-label">Торговля</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span>
      <span class="nav-label">Настройки</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
